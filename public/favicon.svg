<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant Blue & Silver Gradient -->
    <linearGradient id="kyteStrokeGrad" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="300" y2="340">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#002aff" />
      <stop offset="75%" stop-color="#001ce8" />
      <stop offset="100%" stop-color="#051336" />
    </linearGradient>

    <!-- Cyan Inner Accent Gradient -->
    <linearGradient id="kyteAccentGrad" gradientUnits="userSpaceOnUse" x1="90" y1="110" x2="230" y2="250">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#002aff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="kyteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent Background for Browser Favicon -->

  <g filter="url(#kyteGlow)">
    <!-- Left Chevron < -->
    <polyline
      points="160,32 36,180 160,328"
      stroke="url(#kyteStrokeGrad)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Spine | -->
    <line
      x1="160"
      y1="32"
      x2="160"
      y2="328"
      stroke="url(#kyteStrokeGrad)"
      stroke-width="22"
      stroke-linecap="round"
    />

    <!-- Right Chevron > -->
    <polyline
      points="160,32 284,180 160,328"
      stroke="url(#kyteStrokeGrad)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Superposition Diamond Facet -->
    <polygon
      points="160,122 112,180 160,238 208,180"
      fill="rgba(0, 42, 255, 0.35)"
      stroke="url(#kyteAccentGrad)"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Center Quantum Dot -->
    <circle cx="160" cy="180" r="7" fill="#ffffff" />
  </g>
</svg>

