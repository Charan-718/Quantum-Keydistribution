<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" fill="none" role="img" aria-label="DENZIX Quantum Key Distribution Logo">
  <title>DENZIX Quantum Key Distribution Logo</title>
  <desc>Precision vector representation matching the user-designed continuous quantum cryptographic key logotype spelling DENZIX with a diamond key bow, transition channel, typographic key shaft, and telemetry bit.</desc>
  <defs>
    <!-- Metallic Royal Gold Gradient -->
    <linearGradient id="denzixGoldGrad" gradientUnits="userSpaceOnUse" x1="30" y1="70" x2="950" y2="400">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="25%" stop-color="#fce088" />
      <stop offset="65%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="denzixCyanGrad" gradientUnits="userSpaceOnUse" x1="30" y1="70" x2="950" y2="400">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Ambient Quantum Glow Filter -->
    <filter id="denzixKeyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g id="denzix-quantum-key" filter="url(#denzixKeyGlow)">
    <!-- ============================================================== -->
    <!-- 1. KEY BOW: Diamond with central vertical spine < | >          -->
    <!-- ============================================================== -->
    <!-- Left Chevron < -->
    <polyline
      points="157,76 38,237 157,398"
      stroke="url(#denzixGoldGrad)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Vertical Spine | -->
    <line
      x1="157" y1="76" x2="157" y2="398"
      stroke="url(#denzixGoldGrad)"
      stroke-width="18"
      stroke-linecap="round"
    />

    <!-- Right Chevron > -->
    <polyline
      points="157,76 295,237 203,398"
      stroke="url(#denzixGoldGrad)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Superposition Diamond Gemstone (Subtle Cyan Core) -->
    <polygon
      points="157,175 110,237 157,299 204,237"
      fill="rgba(45, 212, 191, 0.16)"
      stroke="url(#denzixCyanGrad)"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <circle cx="157" cy="237" r="5.5" fill="#2dd4bf" />

    <!-- ============================================================== -->
    <!-- 2. TRANSITION PARALLEL CHANNEL & LETTER E                      -->
    <!-- ============================================================== -->
    <!-- From right bow bottom, horizontal step and upward diagonal to top of E -->
    <polyline
      points="203,398 245,398 337,237 433,237 410,306 364,306 318,375 433,375"
      stroke="url(#denzixGoldGrad)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- ============================================================== -->
    <!-- 3. LETTER N                                                    -->
    <!-- ============================================================== -->
    <polyline
      points="433,375 510,237 579,375 648,237"
      stroke="url(#denzixGoldGrad)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- ============================================================== -->
    <!-- 4. LETTER Z                                                    -->
    <!-- ============================================================== -->
    <polyline
      points="648,237 735,237 648,375 735,375"
      stroke="url(#denzixGoldGrad)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- ============================================================== -->
    <!-- 5. LETTER I                                                    -->
    <!-- ============================================================== -->
    <line
      x1="772"
      y1="237"
      x2="772"
      y2="375"
      stroke="url(#denzixGoldGrad)"
      stroke-width="18"
      stroke-linecap="round"
    />

    <!-- ============================================================== -->
    <!-- 6. LETTER X & KEY BIT TEETH                                    -->
    <!-- ============================================================== -->
    <line
      x1="810"
      y1="237"
      x2="900"
      y2="375"
      stroke="url(#denzixGoldGrad)"
      stroke-width="18"
      stroke-linecap="round"
    />
    <line
      x1="810"
      y1="375"
      x2="900"
      y2="237"
      stroke="url(#denzixGoldGrad)"
      stroke-width="18"
      stroke-linecap="round"
    />
    <line
      x1="900"
      y1="237"
      x2="900"
      y2="375"
      stroke="url(#denzixGoldGrad)"
      stroke-width="18"
      stroke-linecap="round"
    />

    <!-- Cyan Quantum Photon node at the key bit tip -->
    <circle cx="900" cy="306" r="6" fill="#2dd4bf" />
  </g>
</svg>